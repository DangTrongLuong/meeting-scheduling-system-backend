spring:
  application:
    name: meeting scheduling system
  server:
    port: 8080
  web:
    resources:
      static-locations: file:uploads/
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:5174
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Authorization,userId,Content-Type,role
      allow-credentials: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true
  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/meeting_scheduling_system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 573126a@
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      max-lifetime: 1800000
      connection-init-sql: SELECT 1
      initialization-fail-timeout: 0
      minimum-idle: 5
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        connection:
          characterEncoding: utf8mb4
          useUnicode: true
        dialect: org.hibernate.dialect.MySQL8Dialect

    # Google OAuth2
  security:
    oauth2:
      client:
