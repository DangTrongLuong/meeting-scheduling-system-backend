# Logging
logging:
  level:
    org:
      springframework:
        security:
          oauth2: TRACE
        web: DEBUG
    root: INFO
    com.meeting.schedule_a_meeting: DEBUG
    com.meeting.schedule_a_meeting.controllers: DEBUG
    com.meeting.schedule_a_meeting.security: DEBUG
    com.meeting.schedule_a_meeting.service: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.servlet.mvc.method.annotation: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

#endpoint Prometheus
